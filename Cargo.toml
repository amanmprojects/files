[package]
name = "files"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native Linux file explorer built with Rune: tabs, SSH and scp, archives, previews, a terminal panel"
repository = "https://github.com/amanmprojects/files"

[[bin]]
name = "files"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5", features = ["native-file-dialog"] }
# The terminal panel: Alacritty's terminal emulator (PTY, VT parser, grid), drawn by Rune.
alacritty_terminal = "0.25"
# org.freedesktop.FileManager1 and single-instance handoff, on the zbus/tokio Rune already uses.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5", features = ["markdown"] }

# Rune's own patches: a dependency's [patch] doesn't apply to the workspace that depends on it.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "f54cbcfa84d995d339c243a579218f5062c940b5" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 16
incremental = true
