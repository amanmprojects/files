<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Files: a folder with ᚠ (fehu, the rune for F) on its front. Built with Rune. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <!-- In the icon's own units: a vertical stroke has no width to stretch a box gradient over. -->
    <linearGradient id="rune" gradientUnits="userSpaceOnUse" x1="0" y1="56" x2="0" y2="92">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <!-- A soft sheen across the top of the tile. -->
  <path d="M4 32 A28 28 0 0 1 32 4 H96 A28 28 0 0 1 124 32 V48 C90 38 38 38 4 52 Z" fill="#ffffff" opacity="0.05"/>

  <g filter="url(#shadow)">
    <!-- Back of the folder, with its tab. -->
    <path d="M22 38 C22 34.7 24.7 32 28 32 H50 C52 32 53.6 32.8 54.8 34.4 L59 40 H100 C103.3 40 106 42.7 106 46 V92 C106 95.3 103.3 98 100 98 H28 C24.7 98 22 95.3 22 92 Z" fill="url(#back)"/>
    <!-- Front panel. -->
    <path d="M22 54 C22 50.7 24.7 48 28 48 H100 C103.3 48 106 50.7 106 54 V92 C106 95.3 103.3 98 100 98 H28 C24.7 98 22 95.3 22 92 Z" fill="url(#front)"/>
  </g>

  <!-- ᚠ: a stave with two branches rising to the right. -->
  <g transform="translate(-2 0)" stroke="url(#rune)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M56 58 V90"/>
    <path d="M56 70 L74 58"/>
    <path d="M56 82 L76 69"/>
  </g>
</svg>
